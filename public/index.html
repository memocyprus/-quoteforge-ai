<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuoteForge AI</title>

<style>
body {
  font-family: system-ui;
  margin: 0;
  background: #f6f7fb;
  color: #172033;
}

main {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 180px;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 10px;
}

button {
  padding: 11px 15px;
  border: 0;
  border-radius: 9px;
  background: #111827;
  color: white;
  font-weight: 700;
  cursor: pointer;
  margin: 8px 8px 0 0;
}

.plans {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.plan {
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 12px;
  flex: 1;
  min-width: 180px;
}pre {
  white-space: pre-wrap;
  background: #f3f4f6;
  padding: 15px;
  border-radius: 10px;
}.result {

  margin-top: 18px;

  background: #f8fafc;

  border: 1px solid #e5e7eb;

  border-radius: 14px;

  padding: 20px;

}

.result h3 {

  margin: 20px 0 8px;

}

.result h3:first-child {

  margin-top: 0;

}

.result ul {

  padding-left: 20px;

}

.result .highlight {

  background: white;

  border: 1px solid #e5e7eb;

  border-radius: 10px;

  padding: 14px;

  margin: 10px 0;



.result {
  margin-top: 18px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 20px;
}

.result h3 {
  margin: 20px 0 8px;
}

.result h3:first-child {
  margin-top: 0;
}

.result ul {
  padding-left: 20px;
}

.result .highlight {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 14px;
  margin: 10px 0;
}


pre {
  white-space: pre-wrap;
  background: #f3f4f6;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<main>

<div class="card">

<h1>QuoteForge AI</h1>

<p>AI quotation assistant for UK trades.</p>

<label>Customer enquiry</label>

<textarea
id="enquiry"
placeholder="Paste a WhatsApp or email enquiry here...">
</textarea>

<button onclick="analyse()">
Analyse with AI
</button>


<div id="output" class="result">

  AI result will appear here.

</div>

<div class="card">

<h2>Plans</h2>

<div class="plans">

<div class="plan">
<h3>Starter</h3>
<p>£19/month</p>
<button onclick="checkout('starter')">
Subscribe
</button>
</div>

<div class="plan">
<h3>Pro</h3>
<p>£39/month</p>
<button onclick="checkout('pro')">
Subscribe
</button>
</div>

<div class="plan">
<h3>Business</h3>
<p>£79/month</p>
<button onclick="checkout('business')">
Subscribe
</button>
</div>

</div>
</div>

</main>

<script>

async function analyse() {

  const enquiry = document.getElementById("enquiry").value;

  const output = document.getElementById("output");

  if (!enquiry.trim()) {

    output.textContent = "Please enter a customer enquiry.";

    return;

  }

  output.textContent = "Analysing enquiry...";

  try {

    const response = await fetch("/api/analyse-enquiry", {

      method: "POST",

      headers: {

        "Content-Type": "application/json"

      },

      body: JSON.stringify({

        enquiry: enquiry

      })

    });

    const data = await response.json();

    if (!response.ok) {

      output.textContent =

        data.error || "Something went wrong.";

    let result;

if (typeof data.result === "string") {
  let raw = data.result
    .replace(/```json/gi, "")
    .replace(/```/g, "")
    .trim();

  result = JSON.parse(raw);
} else {
  result = data.result;
}

      const makeList = (items) =>

        Array.isArray(items) && items.length

          ? `<ul>${items

              .map(item => `<li>${item}</li>`)

              .join("")}</ul>`

          : "<p>Not provided</p>";

      output.innerHTML = `

        <h3>Job summary</h3>

        <div class="highlight">

          <strong>${result.job_type || "Job enquiry"}</strong>

        </div>

        <h3>Tasks</h3>

        ${makeList(result.tasks)}

        <h3>Materials</h3>

        ${makeList(result.materials)}

        <h3>Estimated labour</h3>

        <div class="highlight">

          <strong>

            ${result.estimated_labour_hours?.estimate || "Not provided"}

          </strong>

          <p>

            ${result.estimated_labour_hours?.basis || ""}

          </p>

          <p>

            ${result.estimated_labour_hours?.certainty || ""}

          </p>

        </div>

        <h3>Missing information</h3>

        ${makeList(result.missing_information)}

        <h3>Questions to ask customer</h3>

        ${makeList(result.questions_to_ask)}

        <h3>Notes</h3>

        ${makeList(result.notes)}

      `;

    } catch (e) {

      console.error(e);

      output.textContent = data.result;

    }

  } catch (error) {

    console.error(error);

    output.textContent =

      "Unable to connect to the AI service.";

  }

}

async function checkout(plan) {

  try {

    const response = await fetch(

      "/api/create-checkout-session",

      {

        method: "POST",

        headers: {

          "Content-Type": "application/json"

        },

        body: JSON.stringify({

          plan: plan

        })

      }

    );

    const data = await response.json();

    if (data.url) {

      window.location.href = data.url;

    } else {

      alert(data.error || "Checkout failed.");

    }

  } catch (error) {

    console.error(error);

    alert("Unable to connect to payment service.");

  }

}

</script>
